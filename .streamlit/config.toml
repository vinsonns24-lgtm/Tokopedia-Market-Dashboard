[theme]
base = "light"
primaryColor = "#128c5e"
backgroundColor = "#f3f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f2933"
borderColor = "#e4e8ec"
showWidgetBorder = true
baseRadius = "large"
buttonRadius = "full"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontSize = "1.45rem"
metricValueFontWeight = 700
dataframeHeaderBackgroundColor = "#f6f8f9"
chartCategoricalColors = ["#1baf7a", "#eb6834", "#2a78d6"]

[theme.sidebar]
backgroundColor = "#ffffff"
